name: AI LinkedIn Growth Engine

on:
  workflow_dispatch:
  schedule:
    # 6:00 AM IST = 00:30 UTC
    - cron: "30 0 * * *"

jobs:
  linkedin-growth-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Create Required Directories
        run: |
          mkdir -p src/data
          mkdir -p src/outputs

      - name: Create Memory Files If Missing
        run: |
          if [ ! -f src/data/history.json ]; then
            cat > src/data/history.json <<'EOF'
          {
            "posts": [],
            "topics": [],
            "signatures": [],
            "cta_history": [],
            "voice_history": [],
            "image_styles": []
          }
          EOF
          fi

          if [ ! -f src/data/runs.json ]; then
            echo '[]' > src/data/runs.json
          fi

      - name: Run AI LinkedIn Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          MODEL_PROVIDER: gemini
          IMAGE_PROVIDER: hf
          TEXT_MODEL: gemini-2.5-flash
          IMAGE_MODEL: black-forest-labs/FLUX.1-schnell
          RESEARCH_MODEL: gemini-2.5-flash
          WRITER_MODEL: gemini-2.5-flash
          CRITIC_MODEL: gemini-2.5-flash
        run: |
          cd src
          python main.py

      - name: Upload Generated Outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-run-output
          path: |
            src/outputs
            src/data/history.json
            src/data/runs.json

      - name: Commit Learning Updates
        if: always()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add src/data/history.json src/data/runs.json
          if ! git diff --cached --quiet; then
            git commit -m "update automation memory"
            git push origin main || true
          fi