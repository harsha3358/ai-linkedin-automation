name: Daily AI LinkedIn Post

concurrency:
  group: linkedin-posting
  cancel-in-progress: true

on:
  schedule:
    - cron: '30 2 * * *'

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Secrets
        run: |
          echo "OPENROUTER_API_KEY exists: ${{ secrets.OPENROUTER_API_KEY != '' }}"
          echo "OPENAI_API_KEY exists: ${{ secrets.OPENAI_API_KEY != '' }}"
          echo "NEWS_API_KEY exists: ${{ secrets.NEWS_API_KEY != '' }}"
          echo "LINKEDIN_ACCESS_TOKEN exists: ${{ secrets.LINKEDIN_ACCESS_TOKEN != '' }}"
          echo "LINKEDIN_PERSON_URN exists: ${{ secrets.LINKEDIN_PERSON_URN != '' }}"

      - name: Run AI Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}

        run: |
          python src/main.py
